# cargo-nextest configuration.
#
# Why nextest at all: it runs tests across all cores in one process per test,
# so a full `alo-store` run finishes in seconds where `cargo test`'s
# binary-at-a-time execution took over ten minutes when every tests/*.rs was
# its own binary. The big crates' integration tests are consolidated into a
# handful of suite binaries now (see their Cargo.toml [[test]] targets) —
# execution parallelism and per-test process isolation still come from here.
#
# `cargo test` remains correct and is the fallback where nextest is not
# installed; nothing here changes what the tests assert.
#
# The serial filters below name tests by their module path (`test(...)`), not
# by binary: the former per-file binaries are modules of the suite binaries,
# so the file name lives on as the first segment of the test name.

[test-groups]
# Tests that contend for state which is deliberately NOT tenant-scoped, and so
# cannot run beside each other. Keep this list short and justified: every entry
# is a test that would otherwise be flaky under parallel execution.
serial = { max-threads = 1 }

[[profile.default.overrides]]
# The publish scheduler hands work to sweepers through a global claim: exactly
# one worker may take a due schedule, and a dead worker's claim expires back to
# the pool. Two of these tests racing each other claim the same row and both
# read a result the other caused — a different one fails on each run. That is
# the mechanism working, not a bug in it, so the tests are serialised rather
# than the product changed. Verified 2026-08-12: parallel fails ~1 in 4 runs,
# serial passes 3/3.
filter = 'test(/^site_publish_schedule_tenancy::/)'
test-group = 'serial'

[[profile.default.overrides]]
# The booking-notification sweep claims across every tenant (that is what a
# sweep is), so the two suites that exercise it — alo-store's claim test and
# alo-jmap's end-to-end delivery test — would otherwise claim each other's
# appointments and each fail on rows the other took. Serialised rather than
# weakened: both assert exact counts, which is the point of them.
filter = 'test(/^site_bookings_public::/) or test(/^site_booking_notify::/)'
test-group = 'serial'

[[profile.default.overrides]]
# The domain-registration sweep is the same shape: it claims paid purchases
# across every tenant, so two of these tests running at once take each other's
# rows and the one that lost reports "a paid purchase is offered to the sweep"
# on a row the other is already registering. The suite holds an in-process
# mutex for the `cargo test` fallback, which nextest's process-per-test model
# makes inert — this is what serialises it here. `site_domain_registration`
# (alo-jmap) drives the same sweep end to end, so it belongs to the same group:
# either suite sweeping beside the other registers rows it did not create.
# `sites_domain_purchases_http` joins them because it settles charges: a paid
# purchase is a row waiting for whichever sweep runs next, and a sweep landing
# between that suite's settle and its next read would answer for a state it did
# not choose.
filter = 'test(/^site_domain_purchases::/) or test(/^site_domain_registration::/) or test(/^sites_domain_purchases_http::/)'
test-group = 'serial'

[[profile.default.overrides]]
# The ticket-fulfilment sweep is the same shape again: `site_public_shop`
# claims 500 fulfilments in one call to clear the pool before its own
# assertions, and `site_ticket_orders`' two claiming tests loop until their
# order is offered — run beside each other, the shop's sweep takes the order
# the loop is waiting for and the loop starves to its bound (seen 2026-08-28,
# full-suite run; both binaries pass alone on the same database).
filter = 'test(/^site_ticket_orders::/) or test(/^site_public_shop::/)'
test-group = 'serial'

[[profile.default.overrides]]
# S2.16d's final arc drives all three notification sweeps — form, order and
# booking — end to end, and every sweep claims across tenants by design. Any
# suite asserting an exact delivery count beside it would be counting rows this
# one took (or vice versa), so the arc joins the serial group rather than the
# other suites being weakened into inexact assertions.
filter = 'test(/^sites_final_arc::/)'
test-group = 'serial'
