# alo engine set — pinned versions, sealed containers (ADR 0003).
# Engines are configured, never patched (CLAUDE.md); upstream security
# updates are a version bump here and in scripts/fetch-engines.sh via
# its single source of truth: the image tags below.
#
# Pins verified against upstream registries on 2026-07-25:
#   synapse   v1.157.1     (ghcr.io/element-hq/synapse)
#   livekit   v1.13.4      (livekit/livekit-server)
#   collabora 25.04.9.4.1  (collabora/code) — newest image whose
#     source tag (cp-25.04.9-4) exists in CollaboraOnline/online;
#     the 26.04 CODE images are ahead of public source tagging, and
#     ../engines must be clonable at exactly the pinned version
#   garage    v2.3.0       (dxflrs/garage)
#   postgres  16.14        (library/postgres)
#   rspamd    4.1.2        (rspamd/rspamd)
#
# Bring-up: `docker compose up -d --wait postgres garage rspamd alo-smtp`
# is the Phase 0 working set. Synapse needs a documented one-time
# `generate` bootstrap; LiveKit and Collabora boot with the dev
# placeholders from .env.example. Full tenant wiring for all three is
# ROADMAP.md Phase 2 ("Chat & Meet", "Drive & Docs") — see README.md
# in this directory for exactly what remains.

name: alo

networks:
  alo:

volumes:
  pg_data:
  redis_data:
  garage_meta:
  garage_data:
  synapse_data:
  smtp_spool:
  # Message bytes for local delivery, as production keeps them.
  smtp_blobs:

services:
  redis:
    image: redis:7.4.6-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [alo]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alo-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-alo}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [alo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.3.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-b54d1a2e9c3f47a8b54d1a2e9c3f47a8b54d1a2e9c3f47a8b54d1a2e9c3f47a8}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-alo-dev-admin-token}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [alo]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  rspamd:
    image: rspamd/rspamd:4.1.2
    networks: [alo]
    healthcheck:
      # TCP probe of the controller port; the image is Debian-based so
      # bash's /dev/tcp is available without extra tooling.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11334'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  alo-smtp:
    build:
      context: ..
      dockerfile: products/mail/alo-smtp/Dockerfile
    environment:
      ALO_SMTP_ADDR: 0.0.0.0:2525
      ALO_SMTP_HOSTNAME: ${ALO_SMTP_HOSTNAME:-mx.alo.test}
      ALO_SMTP_SPOOL_DIR: /var/spool/alo
      ALO_SMTP_MAX_MESSAGE_SIZE: ${ALO_SMTP_MAX_MESSAGE_SIZE:-26214400}
      # Outbound stays OFF in the default compose stack (relay safety).
      # Enable per deployment via .env once trusted (submission AUTH now
      # gates it — see below).
      ALO_SMTP_OUTBOUND_ENABLED: ${ALO_SMTP_OUTBOUND_ENABLED:-false}
      ALO_SMTP_SMARTHOST: ${ALO_SMTP_SMARTHOST:-}
      # Submission listeners (STARTTLS on 587, implicit TLS on 465);
      # blank disables. Provide a real PEM via ALO_SMTP_TLS_CERT/KEY
      # in production.
      ALO_SMTP_SUBMISSION_ADDR: ${ALO_SMTP_SUBMISSION_ADDR:-0.0.0.0:587}
      ALO_SMTP_IMPLICIT_TLS_ADDR: ${ALO_SMTP_IMPLICIT_TLS_ADDR:-0.0.0.0:465}
      ALO_SMTP_TLS_CERT: ${ALO_SMTP_TLS_CERT:-}
      ALO_SMTP_TLS_KEY: ${ALO_SMTP_TLS_KEY:-}
      # Self-signed cert generation is opt-in so production never
      # silently presents an untrusted cert. The dev compose stack opts
      # in; set false + a real PEM for production.
      ALO_SMTP_ALLOW_SELF_SIGNED: ${ALO_SMTP_ALLOW_SELF_SIGNED:-true}
      # Submission credentials (dev AUTH bootstrap; alo-identity in
      # M9). Blank means submission AUTH always fails (safe default).
      ALO_SMTP_CREDENTIALS_FILE: ${ALO_SMTP_CREDENTIALS_FILE:-}
      # alo-identity backs submission AUTH, so a submission listener cannot
      # start without a database — `alo-smtp` refuses at boot rather than
      # opening a port that would accept nobody:
      #
      #   configuration error: submission listeners require DATABASE_URL
      #   (alo-identity backs AUTH)
      #
      # This stack opens 587 and 465 by default (above) and gave it no
      # database, so the Phase 0 working set could not come up at all. Same
      # value the production stack uses, pointed at the `postgres` service.
      DATABASE_URL: postgres://${POSTGRES_USER:-alo}:${POSTGRES_PASSWORD:-alo-dev-only}@postgres:5432/${POSTGRES_DB:-alo}?sslmode=disable
      # A database also switches on local delivery, and local delivery has to
      # be told which recipients are local — the server refuses to guess, since
      # guessing wrong means either bouncing your own users or relaying for
      # strangers. Production demands this in `.env` (`:?`); the dev stack
      # defaults to the hostname's own domain so `docker compose up` works with
      # no `.env` at all, which is what the Phase 0 bring-up promises.
      ALO_SMTP_LOCAL_DOMAINS: ${ALO_SMTP_LOCAL_DOMAINS:-alo.test}
      # Local delivery stores the message bytes; without a writable blob
      # directory it refuses to start rather than accepting mail it cannot
      # keep. This service reads its OWN `ALO_SMTP_BLOB_DIR` — the shared
      # `ALO_BLOB_DIR` is what the JMAP side reads — and its default is the
      # relative `./blobs`, which is not writable in the image. Production sets
      # both for the same reason; so does this.
      ALO_BLOB_DIR: /var/lib/alo/blobs
      ALO_SMTP_BLOB_DIR: /var/lib/alo/blobs
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - smtp_spool:/var/spool/alo
      - smtp_blobs:/var/lib/alo/blobs
    ports:
      - "2525:2525"
      - "587:587"
      - "465:465"
    networks: [alo]
    healthcheck:
      test: ["CMD", "/usr/local/bin/alo-smtp", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  synapse:
    image: ghcr.io/element-hq/synapse:v1.157.1
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-chat.alo.test}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapse_data:/data
    networks: [alo]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  livekit:
    image: livekit/livekit-server:v1.13.4
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50019:50000-50019/udp"
    networks: [alo]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  meet-egress:
    profiles: ["recording"]
    image: livekit/egress:v1.10.0
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${ALO_MEET_API_KEY:-alo-dev-key}
        api_secret: ${ALO_MEET_API_SECRET:-alo-dev-secret-placeholder-not-for-production}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        s3:
          access_key: ${ALO_MEET_RECORDING_S3_ACCESS_KEY:-}
          secret: ${ALO_MEET_RECORDING_S3_SECRET:-}
          region: ${ALO_MEET_RECORDING_S3_REGION:-garage}
          endpoint: ${ALO_MEET_RECORDING_S3_ENDPOINT:-http://garage:3900}
          bucket: ${ALO_MEET_RECORDING_S3_BUCKET:-alo-meet-recordings}
          force_path_style: true
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks: [alo]

  meet-transcriber:
    profiles: ["transcription"]
    build:
      context: ..
      dockerfile: products/meet/alo-transcriber/Dockerfile
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${ALO_MEET_API_KEY:-alo-dev-key}
      LIVEKIT_API_SECRET: ${ALO_MEET_API_SECRET:-alo-dev-secret-placeholder-not-for-production}
      ALO_TRANSCRIPTION_PROVIDER: ${ALO_TRANSCRIPTION_PROVIDER:-}
      ALO_TRANSCRIPTION_MODEL: ${ALO_TRANSCRIPTION_MODEL:-}
      ALO_TRANSCRIPTION_LANGUAGE: ${ALO_TRANSCRIPTION_LANGUAGE:-multi}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      livekit:
        condition: service_healthy
    networks: [alo]

  collabora:
    image: collabora/code:25.04.9.4.1
    environment:
      username: ${COLLABORA_ADMIN_USER:-alo-admin}
      password: ${COLLABORA_ADMIN_PASSWORD:-alo-dev-only}
      aliasgroup1: ${COLLABORA_ALIASGROUP1:-http://drive\.alo\.test:80}
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
    networks: [alo]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9980'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
