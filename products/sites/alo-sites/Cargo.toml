[package]
name = "alo-sites"
description = "alo Sites public serving: renders published site pages to complete static HTML (and, from the service slice, serves them by Host)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alo-store = { path = "../../../platform/alo-store" }
# The visitor assistant's answering pipeline (S3.02e): deterministic
# retrieval + the tenant-configured model call, held to the citation rule.
alo-ai = { path = "../../../platform/alo-ai" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The service slice: the Host-resolving public server (`serve` module + the
# `alo-sites` binary).
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing-subscriber = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# Responsive image derivatives (`images` + `serve::derivative`): decoding,
# cropping and resizing published photos into the widths the `srcset` offers.
image = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
# In-process integration tests: oneshot requests through the real router,
# fixtures written through the real store against the compose Postgres.
tower = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
